<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Envelope Challenge</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"><style id="css">
/* VOICE: friendly, practical, a little celebratory when an envelope gets filled.
   IDEA: a box of kraft-paper cash envelopes on the kitchen table.
   PICTURE: the board of numbered envelopes itself; filled ones turn green and get a red wax seal.
   COLOUR and TYPE: kraft brown + cash green + wax-seal red on white (deep brown-black at night); Barlow Condensed for numbers, Barlow for text.
   LAYOUT: modest title, progress strip with the Draw button, the envelope board, then history and settings. */
:root{color-scheme:light dark;--bg:light-dark(#fff,#14120f);--ink:light-dark(#1d1a16,#f3eee6);--mute:light-dark(#6b645a,#a89f92);--line:light-dark(#e8e2d8,#2e2a24);--panel:light-dark(#f7f3ed,#1d1a16);--kraft:light-dark(#dcbd90,#a5825a);--kraft2:light-dark(#c9a774,#8c6c45);--paper-ink:#3a2912;--green:light-dark(#1f6b45,#2f9a63);--green2:light-dark(#185a3a,#257d50);--seal:#b3261e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Barlow,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,3vw,40px) max(5vw,16px);max-width:1240px;margin:0 auto}
h1,h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,5vw,44px)}h2{font-size:24px;margin-bottom:12px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 24px;padding-bottom:0}
.sub{margin:4px 0 0;color:var(--mute)}
.status{margin:0;font-size:14px;color:var(--mute)}.status.bad{color:var(--seal)}
.dash{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:20px 32px;align-items:center}
.big{font:700 clamp(40px,6vw,60px)/1 'Barlow Condensed',sans-serif;color:var(--green);white-space:nowrap}
.of{color:var(--mute);margin:2px 0 10px}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0}
.stats div{background:var(--panel);border-radius:10px;padding:12px 14px}
.stats dt{font-size:13px;color:var(--mute)}.stats dd{margin:2px 0 0;font:600 24px/1.1 'Barlow Condensed',sans-serif;white-space:nowrap}
button{font:600 16px Barlow,sans-serif;min-height:44px;padding:0 20px;border-radius:10px;border:0;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
.pri{background:var(--green);color:#fff}.pri:hover{background:var(--green2)}
.draw{font-size:19px;min-height:56px;padding:0 28px;white-space:nowrap}
button:disabled{opacity:.45;cursor:default}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.ghost:hover{border-color:var(--mute)}
.done{font:600 22px 'Barlow Condensed',sans-serif;color:var(--green);margin:0}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:10px}
.env{position:relative;aspect-ratio:4/3;border-radius:6px;background:var(--kraft);color:var(--paper-ink);font:600 clamp(16px,2vw,22px)/1 'Barlow Condensed',sans-serif;display:flex;align-items:flex-end;justify-content:center;padding:0 0 7%;overflow:hidden;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.12);min-height:44px}
.env::before{content:'';position:absolute;inset:0 0 auto 0;height:44%;background:var(--kraft2);clip-path:polygon(0 0,100% 0,50% 100%)}
.env span{position:relative}
.env:hover{filter:brightness(1.05)}
.env.on{background:var(--green);color:#fff}.env.on::before{background:var(--green2)}
.env.on::after{content:'';position:absolute;left:50%;top:44%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--seal);box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.env.last{outline:3px solid var(--seal);outline-offset:2px}
.hint{color:var(--mute);font-size:14px;margin:12px 0 0}
.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px 48px;border-top:1px solid var(--line)}
.log{list-style:none;margin:0 0 14px;padding:0}
.log li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.log b{font-family:'Barlow Condensed',sans-serif;font-size:19px;white-space:nowrap}.log span{color:var(--mute);white-space:nowrap}
.empty{color:var(--mute);margin:0 0 14px}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:12px}
select{display:block;width:100%;max-width:260px;margin-top:4px;font:16px Barlow,sans-serif;min-height:44px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.warn{background:var(--panel);border-left:4px solid var(--seal);border-radius:8px;padding:12px 14px;margin:8px 0 12px}
.warn p{margin:0 0 10px}
.bkh{margin-top:28px}.bkp{margin:0 0 12px}
.filebtn{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:10px;margin:0;font:600 16px Barlow,sans-serif;color:var(--ink);cursor:pointer}
.filebtn:focus-visible{outline:3px solid var(--seal);outline-offset:2px}.row{display:flex;flex-wrap:wrap;gap:10px}
.ov{position:fixed;inset:0;background:rgba(15,12,8,.55);display:grid;place-items:center;padding:16px;z-index:9}
.card{background:var(--bg);border-radius:16px;padding:24px;width:min(420px,100%);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .25s ease-out}
.card .lbl{margin:0 0 14px;color:var(--mute);font-weight:500}
.bigenv{position:relative;margin:0 auto 16px;width:min(280px,80%);aspect-ratio:4/3;border-radius:10px;background:var(--kraft);color:var(--paper-ink);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10%;overflow:hidden}
.bigenv::before{content:'';position:absolute;inset:0 0 auto 0;height:52%;background:var(--kraft2);clip-path:polygon(0 0,100% 0,50% 100%)}
.bigenv.on{background:var(--green);color:#fff}.bigenv.on::before{background:var(--green2)}
.bigenv span{position:relative;font:700 clamp(48px,14vw,72px)/1 'Barlow Condensed',sans-serif;white-space:nowrap}
.card p{margin:0 0 16px}.card .row{justify-content:center}
@keyframes pop{from{transform:scale(.92);opacity:0}}
@media(prefers-reduced-motion:reduce){.card{animation:none}.bar i{transition:none}}
@media(max-width:900px){.dash{grid-template-columns:minmax(0,1fr) auto}.stats{grid-column:1/-1;grid-row:2}}
@media(max-width:700px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:600px){.dash{grid-template-columns:minmax(0,1fr)}.draw{width:100%}.stats{grid-row:auto}.lower{grid-template-columns:minmax(0,1fr)}.stats dd{font-size:20px}}
</style></head><body><div id="app"></div><script type="application/json" id="st">{"v":1,"size":100,"mult":1,"log":[]}</script><script>{
const SELF=document.currentScript.textContent;
const CSS=document.getElementById('css').textContent;
const fresh=()=>({v:1,size:100,mult:1,log:[]});
let S;try{S=JSON.parse(document.getElementById('st').textContent)}catch(e){S=null}
if(!S||!Array.isArray(S.log))S=fresh();
let art=null,mode='wait',status='',timer=null,pick=null,pend=null,bkmsg='';
function exportBackup(){
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
  a.download='envelope-challenge-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();bkmsg='Backup downloaded.'}
  catch(e){bkmsg="Couldn't download a backup in this browser."}
  render();
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    const ok=d&&[50,100].includes(d.size)&&[0.5,1,2].includes(d.mult)&&Array.isArray(d.log)&&d.log.every(x=>Array.isArray(x)&&Number.isInteger(x[0])&&x[0]>=1&&x[0]<=d.size&&/^\d{4}-\d\d-\d\d$/.test(x[1]));
    if(!ok)throw 0;
    S={v:1,size:d.size,mult:d.mult,log:d.log.filter((x,i,a)=>a.findIndex(y=>y[0]===x[0])===i)};pend=null;bkmsg='Backup restored.';commit();
  }catch(e){bkmsg="That file isn't an Envelope Challenge backup.";render()}};
  r.readAsText(file);
}
const KEY='envelope-challenge';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ready=(window.claude&&typeof claude.use==='function'?claude.use('artifact'):Promise.resolve(null)).then(a=>{
  art=a;mode=a?'cloud':'local';
  if(!a){try{const l=JSON.parse(localStorage.getItem(KEY)||'null');if(l&&Array.isArray(l.log))S=l}catch(e){}}
  render();
}).catch(()=>{mode='local';render()});

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const nice=s=>new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
const money=v=>'$'+(Number.isInteger(v)?v.toLocaleString('en-US'):v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}));
const amt=n=>n*S.mult;
const goal=()=>S.size*(S.size+1)/2*S.mult;
const filledMap=()=>{const m=new Map();for(const[n,d]of S.log)m.set(n,d);return m};
const remaining=f=>{const r=[];for(let i=1;i<=S.size;i++)if(!f.has(i))r.push(i);return r};
const multName={0.5:'half-size',1:'',2:'double'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function statusText(){
  if(status==='saving')return['Saving…',''];
  if(status==='err')return["Couldn't save that change. Try again.",'bad'];
  if(status==='ro')return['View only: changes can\u2019t be saved here.','bad'];
  if(mode==='local')return['Saved in this browser only.',''];
  return['Progress saves automatically.',''];
}

function render(){
  const f=filledMap(),rem=remaining(f);
  const saved=S.log.reduce((t,[n])=>t+amt(n),0),g=goal(),left=rem.length;
  const pct=Math.min(100,saved/g*100);
  const last=S.log.length?S.log[S.log.length-1][0]:null;
  let fin='—';
  if(left){const d=new Date();if(last!==null&&S.log[S.log.length-1][1]===today())d.setDate(d.getDate()+1);d.setDate(d.getDate()+left-1);fin=d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:d.getFullYear()!==new Date().getFullYear()?'numeric':undefined})}
  const [st,stc]=statusText();
  const ro=status==='ro';
  const envs=Array.from({length:S.size},(_,i)=>{const n=i+1,on=f.has(n);return`<button class="env${on?' on':''}${n===last?' last':''}" data-n="${n}" aria-label="Envelope ${n}, ${money(amt(n))}${on?', saved':''}"><span>${S.mult===1?n:money(amt(n))}</span></button>`}).join('');
  const recent=S.log.slice(-8).reverse().map(([n,d])=>`<li><b>${money(amt(n))}</b><span>Envelope ${n} · ${nice(d)}</span></li>`).join('');
  const mn=multName[S.mult];
  document.getElementById('app').innerHTML=`
<header class="band hd"><div><h1>Envelope Challenge</h1><p class="sub">${S.size} envelopes · ${money(g)} goal${mn?' · '+mn+' amounts':''}</p></div><p class="status ${stc}" role="status">${esc(st)}</p></header>
<section class="band dash">
  <div><div class="big">${money(saved)}</div><div class="of">saved of ${money(g)} · ${Math.floor(pct)}%</div><div class="bar" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div>
  <dl class="stats"><div><dt>Envelopes left</dt><dd>${left}</dd></div><div><dt>Still to save</dt><dd>${money(g-saved)}</dd></div><div><dt>One a day, done by</dt><dd>${fin}</dd></div></dl>
  ${left?`<button class="pri draw" id="draw" ${ro?'disabled':''}>Draw an envelope</button>`:`<p class="done">Challenge complete!</p>`}
</section>
<section class="band"><div class="grid">${envs}</div><p class="hint">Green envelopes are saved. Tap any envelope to fill it yourself or undo it.</p></section>
<section class="band lower">
  <div><h2>Recent deposits</h2>${recent?`<ul class="log">${recent}</ul><button class="ghost" id="undo" ${ro?'disabled':''}>Undo last deposit</button>`:`<p class="empty">Nothing saved yet. Draw your first envelope to get started.</p>`}</div>
  <div><h2>Settings</h2>
    <label>Number of envelopes<select id="size" ${ro?'disabled':''}>${[100,50].map(v=>`<option value="${v}"${v===S.size?' selected':''}>${v} envelopes (${money(v*(v+1)/2*S.mult)})</option>`).join('')}</select></label>
    <label>Amount per envelope<select id="mult" ${ro?'disabled':''}>${[[0.5,'Half: envelope 10 = $5'],[1,'Standard: envelope 10 = $10'],[2,'Double: envelope 10 = $20']].map(([v,t])=>`<option value="${v}"${v===S.mult?' selected':''}>${t}</option>`).join('')}</select></label>
    ${pend?`<div class="warn"><p>${pend.reset?'Start the challenge over?':'Changing this starts the challenge over.'} Your ${S.log.length} deposit${S.log.length===1?'':'s'} will be cleared.</p><div class="row"><button class="pri" id="yes">Start over</button><button class="ghost" id="no">Keep my progress</button></div></div>`:(S.log.length?`<button class="ghost" id="reset" ${ro?'disabled':''}>Start over</button>`:'')}
    <h2 class="bkh">Backup</h2>
    <p class="hint bkp">Your progress is saved in this browser. Download a backup to keep a copy, or restore it on another device.</p>
    <div class="row"><button class="ghost" id="exp">Download backup</button><label class="ghost filebtn" tabindex="0">Restore backup<input type="file" id="imp" accept=".json,application/json" hidden></label></div>
    ${bkmsg?`<p class="hint" role="status">${esc(bkmsg)}</p>`:''}
  </div>
</section>
${pick?overlay(pick,f,left):''}`;
  if(pick)setTimeout(()=>{const b=document.querySelector('.card button');b&&b.focus()},0);
}

function overlay(p,f,left){
  const on=f.has(p.n),ro=status==='ro';
  return`<div class="ov" id="ov"><div class="card" role="dialog" aria-modal="true" aria-labelledby="pk">
  <p class="lbl">${p.drawn?'You drew envelope':'Envelope'} ${p.n}</p>
  <div class="bigenv${on?' on':''}"><span id="pk">${money(amt(p.n))}</span></div>
  ${on?`<p>Saved on ${nice(f.get(p.n))}.</p><div class="row"><button class="ghost" id="close">Close</button><button class="ghost" id="unmark" ${ro?'disabled':''}>Undo this envelope</button></div>`
  :`<p>Move ${money(amt(p.n))} into savings, then mark it done.</p><div class="row"><button class="pri" id="mark" ${ro?'disabled':''}>I saved it</button>${p.drawn&&left>1?'<button class="ghost" id="redraw">Draw a different one</button>':''}<button class="ghost" id="close">Not now</button></div>`}
  </div></div>`;
}

function draw(){
  const rem=remaining(filledMap());if(!rem.length)return;
  const n=rem[Math.floor(Math.random()*rem.length)];
  pick={n,drawn:true};render();
  if(RM||rem.length<2)return;
  const el=document.getElementById('pk');let k=0;
  const t=setInterval(()=>{if(!el.isConnected){clearInterval(t);return}
    if(++k>12){clearInterval(t);el.textContent=money(amt(n));return}
    el.textContent=money(amt(rem[Math.floor(Math.random()*rem.length)]))},50);
}

function doc(){
  return'<!DOCTYPE html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Envelope Challenge</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"><style id="css">'+CSS+'</style></head><body><div id="app"></div><script type="application/json" id="st">'+JSON.stringify(S).replace(/</g,'\\u003c')+'<\/script><script>'+SELF+'<\/script></body></html>';
}

function commit(){status='saving';render();clearTimeout(timer);timer=setTimeout(persist,700)}
async function persist(){
  await ready;
  if(mode==='cloud'&&art){
    try{await art.publish(doc())}
    catch(e){const c=String(e&&(e.code||e.message||e.name)||e);
      if(/not_granted|not_writer/.test(c))status='ro';else if(/conflict/.test(c))return;else status='err';render()}
  }else{
    try{localStorage.setItem(KEY,JSON.stringify(S));status=''}catch(e){status='err'}
    render();
  }
}

function applySettings(size,mult){S={v:1,size,mult,log:[]};pend=null;commit()}

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.id==='ov'){pick=null;render();return}
  const b=t.closest('button');if(!b)return;
  if(b.dataset.n){pick={n:+b.dataset.n,drawn:false};render();return}
  switch(b.id){
    case'draw':case'redraw':draw();break;
    case'close':pick=null;render();break;
    case'mark':S.log.push([pick.n,today()]);pick=null;commit();break;
    case'unmark':{const n=pick.n;S.log=S.log.filter(x=>x[0]!==n);pick=null;commit();break}
    case'undo':S.log.pop();commit();break;
    case'reset':pend={reset:true,size:S.size,mult:S.mult};render();break;
    case'yes':applySettings(pend.size,pend.mult);break;
    case'no':pend=null;render();break;
    case'exp':exportBackup();break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='imp'){const f=e.target.files&&e.target.files[0];if(f)importBackup(f);return}
  if(e.target.id!=='size'&&e.target.id!=='mult')return;
  const size=+document.getElementById('size').value,mult=+document.getElementById('mult').value;
  if(!S.log.length)applySettings(size,mult);else{pend={size,mult};render()}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('filebtn')){e.preventDefault();document.getElementById('imp').click();return}if(e.key==='Escape'&&pick){pick=null;render()}});
render();
}</script></body></html>
